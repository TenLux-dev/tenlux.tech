<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TenLux — OG image generator</title>
<link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body { background: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; min-height: 100vh; justify-content: center; }
canvas { max-width: 100%; height: auto; border: 1px solid #333; border-radius: 8px; }
button { margin-top: 20px; padding: 14px 32px; background: #fff; color: #000; border: none; border-radius: 8px; font-size: 1rem; font-weight: 500; cursor: pointer; }
button:hover { background: #ccc; }
p { color: #888; font-size: 0.9rem; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<canvas id="og" width="1200" height="630"></canvas>
<button id="download">Скачать PNG</button>
<p>Размер: 1200×630 px — стандарт для Open Graph</p>

<script>
document.fonts.ready.then(function() {
    const canvas = document.getElementById('og');
    const ctx = canvas.getContext('2d');

    // Фон
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, 1200, 630);

    // Лёгкое свечение по центру
    const gradient = ctx.createRadialGradient(600, 315, 0, 600, 315, 500);
    gradient.addColorStop(0, 'rgba(255, 255, 255, 0.06)');
    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 1200, 630);

    // TENLUX
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 160px Tektur, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('TENLUX', 600, 280);

    // Слоган
    ctx.fillStyle = '#888888';
    ctx.font = '400 32px Tektur, sans-serif';
    ctx.fillText('DARK OUTSIDE. LIGHT INSIDE.', 600, 420);

    // Домен
    ctx.fillStyle = '#555555';
    ctx.font = '400 22px Tektur, sans-serif';
    ctx.fillText('TENLUX.TECH', 600, 490);
});

document.getElementById('download').addEventListener('click', function() {
    const canvas = document.getElementById('og');
    const link = document.createElement('a');
    link.download = 'og-image.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
});
</script>

</body>
</html>

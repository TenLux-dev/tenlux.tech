<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<title>TenLux — OG image generator</title>
<link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; font-family: sans-serif; }
.og-canvas {
    width: 100%;
    max-width: 800px;
    aspect-ratio: 1200 / 630;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    gap: 24px;
    position: relative;
    overflow: hidden;
}
.og-canvas::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.06) 0%, transparent 60%);
    pointer-events: none;
}
.og-title {
    font-family: 'Tektur', sans-serif;
    font-weight: 700;
    color: #ffffff;
    font-size: clamp(3rem, 14vw, 8rem);
    letter-spacing: 0.08em;
    line-height: 1;
    z-index: 1;
}
.og-tagline {
    font-family: 'Tektur', sans-serif;
    font-weight: 400;
    color: #888888;
    font-size: clamp(0.8rem, 2.4vw, 1.3rem);
    letter-spacing: 0.25em;
    text-align: center;
    z-index: 1;
}
.og-sub {
    font-family: 'Tektur', sans-serif;
    font-weight: 400;
    color: #555555;
    font-size: clamp(0.6rem, 1.6vw, 0.9rem);
    letter-spacing: 0.15em;
    margin-top: 12px;
    z-index: 1;
}
.hint { color: #888; margin-top: 20px; text-align: center; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="og-canvas">
<div class="og-title">TENLUX</div>
<div class="og-tagline">DARK OUTSIDE. LIGHT INSIDE.</div>
<div class="og-sub">TENLUX.TECH</div>
</div>
<p class="hint">Сделай скриншот чёрного квадрата → загрузи как og-image.png в корень репозитория</p>
</body>
</html>
